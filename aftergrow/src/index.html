<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101022">
<meta name="description" content="퇴근 3분 전 폭주한 회사를 탈출하라! 네 명의 직장인이 펼치는 오피스 생존 액션.">
<title>CLOCK OUT! — 퇴근 전쟁</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar">
    <button class="brand" data-nav="home" aria-label="처음 화면"><span id="brand-icon"></span><span>CLOCK OUT!<small>INTERACTIVE WEBTOON</small></span></button>
    <nav class="main-nav" aria-label="주요 메뉴">
      <button class="nav-link active" data-nav="home">작품 홈</button>
      <button class="nav-link" data-nav="roster">등장인물 <sup>04</sup></button>
      <button class="nav-link" data-nav="map">회차 목록</button>
      <button class="nav-link" data-nav="archive">비하인드</button>
      <button class="nav-link" data-nav="workshop">성장</button>
    </nav>
    <div class="top-tools"><span class="seed-wallet" id="wallet" title="작전으로 모은 업무 포인트"></span><button class="tool-button" id="sound-btn" title="소리 전환 (M)" aria-label="소리 켜기" aria-pressed="false"></button><button class="tool-button" id="help-btn" title="조작법 (F1)" aria-label="조작법 열기"></button></div>
  </header>
  <main id="main">
    <section id="menu" class="menu-view" aria-live="off"></section>
    <section id="play-view" class="play-view" hidden aria-label="웹툰형 오피스 생존 액션">
      <canvas id="game" tabindex="0" role="img" aria-label="WASD 또는 방향키 이동. Space 돌진. E 전용 스킬. P 일시정지. 터치 드래그 이동."></canvas>
      <div class="play-vignette"></div>
      <div id="hud" class="hud">
        <div class="hud-person"><img id="hud-portrait" alt=""><div><span class="micro" id="hud-name"></span><div class="hp-track"><i id="hp-fill"></i></div><div class="hp-meta"><span id="hp-text"></span><span id="lv-text">LV 01</span></div></div></div>
        <div class="hud-clock"><span id="chapter-label" class="micro"></span><strong id="clock">03:00</strong><span id="objective">최종 관리자를 처치하세요</span></div>
        <div class="hud-counter"><span class="micro">처리한 업무</span><strong id="kill-text">000</strong><button id="pause-btn" class="tool-button" aria-label="일시정지">Ⅱ</button></div>
        <div class="xp-track"><i id="xp-fill"></i><span id="xp-text"></span></div>
      </div>
      <div id="boss-hud" class="boss-hud" hidden><div><span id="boss-name"></span><span id="boss-percent"></span></div><div><i id="boss-fill"></i></div></div>
      <div id="mission" class="mission"><span class="micro">FIELD OBJECTIVE</span><p id="mission-text">커피 머신의 원 안에서 2초 머무르세요.</p><span id="nodes-text">커피 머신 사용 0회</span></div>
      <div class="actionbar" id="actionbar"><div id="module-rack" class="module-rack"></div><div class="skill-buttons"><button id="skill-btn" class="ability-button"><span class="ability-icon" id="skill-icon"></span><span><b id="skill-name"></b><small id="skill-cd"></small></span><kbd>E</kbd><i id="skill-cover"></i></button><button id="dash-btn" class="ability-button dash"><span class="ability-icon" id="dash-icon"></span><span><b>돌진</b><small id="dash-cd">준비 완료</small></span><kbd>SPACE</kbd><i id="dash-cover"></i></button></div></div>
      <div class="touch-stick" id="touch-stick" hidden aria-hidden="true"><div id="touch-knob"></div><span class="touch-stick-label">이동</span></div>
      <div id="chapter-cut" class="chapter-cut" hidden></div>
      <div id="battle-toast" class="battle-toast" role="status"></div>
    </section>
    <div id="overlay" class="overlay" hidden></div>
  </main>
  <footer id="footer"><span>CLOCK OUT! · 오늘도 무사히 퇴근하세요.</span><span>INTERACTIVE COMIC <i>✧</i> SEASON 01</span><button data-nav="help">게임 이용 가이드 ↗</button></footer>
</div>
<div id="site-toast" class="site-toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem">이 게임을 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
<script src="js/content.js"></script>
<script src="js/storage.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
