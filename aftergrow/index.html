<script>
window.AG = window.AG || {};
AG.Store = (() => {
  const KEY='clockout.office.v1';
  const finite=(v,max=1e7)=>Number.isFinite(v)?Math.max(0,Math.min(max,Math.floor(v))):0;
  const defaults=()=>({version:2,seeds:0,runs:0,kills:0,clears:{},research:{vitality:0,focus:0,gather:0},archive:['origin'],selected:'rook',chapter:0,choices:{},best:{},settings:{sound:false,motion:!matchMedia('(prefers-reduced-motion: reduce)').matches,tutorialSeen:false}});
  let data=defaults(), available=true;
  try {
    const raw=JSON.parse(localStorage.getItem(KEY)||'null');
    if(raw && raw.version===2){
      for(const k of ['seeds','runs','kills'])data[k]=finite(raw[k]);
      for(const k of ['vitality','focus','gather'])data.research[k]=finite(raw.research?.[k],3);
      data.selected=AG.Content.characters.some(c=>c.id===raw.selected)?raw.selected:'rook';
      data.chapter=finite(raw.chapter,2);
      data.archive=Array.isArray(raw.archive)?[...new Set(['origin',...raw.archive.filter(x=>AG.Content.archives.some(a=>a.id===x))])]:['origin'];
      for(const c of AG.Content.chapters){
        data.clears[c.id]=finite(raw.clears?.[c.id]);
        data.best[c.id]=finite(raw.best?.[c.id]);
      }
      if(raw.choices&&typeof raw.choices==='object'){
        for(const c of AG.Content.chapters)for(const ch of AG.Content.characters){
          const key=ch.id+':'+c.id,v=raw.choices[key];
          if(c.event.choices.some(x=>x.id===v))data.choices[key]=v;
        }
      }
      if(typeof raw.settings?.sound==='boolean')data.settings.sound=raw.settings.sound;
      if(typeof raw.settings?.motion==='boolean')data.settings.motion=raw.settings.motion;
      if(typeof raw.settings?.tutorialSeen==='boolean')data.settings.tutorialSeen=raw.settings.tutorialSeen;
    }
    localStorage.setItem(KEY,JSON.stringify(data));
  } catch(_){ available=false; }
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(_){available=false;return false;}};
  const unlock=id=>{if(!data.archive.includes(id)){data.archive.push(id);save();}};
  return {get data(){return data;},get available(){return available;},save,unlock,
    buy(id){const r=AG.Content.research.find(x=>x.id===id);if(!r)return false;const lv=data.research[id],cost=r.cost*(lv+1);if(lv>=r.max||data.seeds<cost)return false;data.seeds-=cost;data.research[id]++;save();return true;},
    finish(result){
      const reward=Math.max(5,Math.floor(result.kills/6)+result.nodes*3+(result.win?35:0));
      data.runs++;data.kills+=result.kills;data.seeds+=reward;data.best[result.chapter.id]=Math.max(data.best[result.chapter.id]||0,result.kills);
      if(result.win){
        data.clears[result.chapter.id]=(data.clears[result.chapter.id]||0)+1;
        unlock(result.chapter.note);unlock(result.character.id);
        if(AG.Content.chapters.every(c=>data.clears[c.id]))unlock('ending');
      }
      if(result.choice)data.choices[result.character.id+':'+result.chapter.id]=result.choice.id;
      save();return reward;
    }
  };
})();

</script>

  function enemy(type,chapter=0){

      const col=shades[chapter];

      ${chapter===0?'<path d="M-48-30h96M-48-11h96M-48 8h55" stroke="#503a5a" stroke-width="9"/><text x="0" y="53" fill="#432241" text-anchor="middle" font-family="Arial" font-size="27" font-weight="900">DUE!</text>':chapter===1?'<rect x="-49" y="-38" width="98" height="74" fill="#ffd8eb" stroke="#79355f" stroke-width="6"/><circle cx="-22" cy="-10" r="12" fill="#c75288"/><path d="M0-7h35m-35 17h35M-30 26h60" stroke="#9e5080" stroke-width="6"/>':'<rect x="-48" y="-40" width="96" height="83" fill="#1f2c4b" stroke="#b3f6e9" stroke-width="5"/><path d="m-28 0 14-16-14-16m35 30h22" stroke="#78eecb" stroke-width="7" fill="none"/><text x="0" y="59" text-anchor="middle" fill="#243e5b" font-family="Arial" font-size="15" font-weight="900">404 HOME</text>'}

    return wrap(`<g transform="translate(125 ${type==='boss'?129:160}) scale(${type==='boss'?1:.86})">${shape}</g>`,type==='boss'?'0 0 250 250':'72 87 106 117');
  }
  function scene(chapter=0,cast=true){
    const pal=[['#d65795','#263763','#ffc73d'],['#a83e95','#25224a','#ff7bac'],['#304f92','#0c1738','#7bebe0']][chapter];
    const [sun,dark,accent]=pal;
    let s=`<rect width="1400" height="840" fill="${dark}"/>
      <path d="M0 0h1400v570L488 730 0 486Z" fill="url(#sky)"/>
      <path d="M515-20h920v645l-915 58Z" fill="${dark}" opacity=".17"/>
      <circle cx="990" cy="195" r="190" fill="${accent}" opacity=".17"/>
      <circle cx="990" cy="195" r="140" fill="${accent}" opacity=".13"/>
      <path d="M0 740 1400 490v350H0Z" fill="#23253e"/>
      <path d="M0 786 1400 540" stroke="${accent}" stroke-opacity=".13" stroke-width="15"/>
      <path d="M445 0 435 840m330-840 5 840m315-840 4 840" stroke="#0c1730" stroke-width="22" opacity=".7"/>`;
    // Distant city in huge office windows.
    for(let i=0;i<18;i++){
      const x=520+i*51;const h=155+(i*37)%250;
      s+=`<rect x="${x}" y="${470-h}" width="${43+i%3*5}" height="${h+60}" fill="${i%3?'#1d244b':'#202b59'}" stroke="#121a39" stroke-width="4"/>`;
      for(let yy=485-h;yy<476;yy+=24)for(let xx=x+8;xx<x+38;xx+=14)if((Math.round(xx+yy)+i)%5!==0)s+=`<rect x="${xx}" y="${yy}" width="7" height="10" fill="${accent}" opacity="${.1+((i+xx)%4)*.1}"/>`;
    }
    s+=`<path d="M430 0v513H1400" fill="none" stroke="#151a33" stroke-width="22"/><path d="M740 0v500M1050 0v500" stroke="#151a33" stroke-width="15"/>`;
    if(chapter===0){
      // open office desks, monitor screens, swivel chairs
      for(let i=0;i<5;i++){
        const x=535+i*177,y=545+i%2*38;
        s+=`<g transform="translate(${x} ${y})"><path d="M-60 60h153v14H-60Z" fill="#e2a767" stroke="#222543" stroke-width="8"/><rect x="-26" y="-38" width="81" height="57" rx="6" fill="#1d294a" stroke="#121729" stroke-width="7"/><rect x="-18" y="-30" width="64" height="39" fill="${i%2?'#fc9ca7':'#84c7de'}"/><path d="M14 20v40" stroke="#1d294a" stroke-width="10"/><path d="M-34 76v59m110-59v59" stroke="#181c35" stroke-width="9"/></g>`;
      }
    }else if(chapter===1){
      s+=`<rect x="700" y="130" width="550" height="300" rx="10" fill="#1c2141" stroke="#f7a1c4" stroke-width="13"/><rect x="720" y="150" width="510" height="260" fill="#4e477b"/>
        <path d="M770 232h390m-390 55h290m-290 55h345" stroke="#ffaec7" stroke-width="10" opacity=".55"/>
        <circle cx="1158" cy="190" r="21" fill="#ffce40"/>
        <path d="M550 626 980 511l305 105-460 194Z" fill="#e1a5b2" stroke="#222344" stroke-width="15"/><path d="M640 610 830 562l322 78" stroke="#714d85" stroke-width="8"/>`;
    }else{
      for(let i=0;i<7;i++){
        const x=542+i*114;
        s+=`<rect x="${x}" y="175" width="96" height="390" rx="6" fill="#131b35" stroke="#45588d" stroke-width="10"/>`;
        for(let k=0;k<10;k++)s+=`<rect x="${x+15}" y="${192+k*34}" width="67" height="21" rx="2" fill="#283962" stroke="#5674a6" stroke-width="3"/><circle cx="${x+70}" cy="${204+k*34}" r="4" fill="${k%4?'#72dce0':'#ff818c'}"/>`;
      }
      s+=`<path d="M580 740h720" stroke="#5eead7" stroke-width="8" opacity=".35"/>`;
    }
    s+=`<path d="M465 705 1400 619v221H465Z" fill="#25233f" opacity=".85"/><path d="M480 725 1380 648" stroke="${accent}" stroke-opacity=".31" stroke-width="5"/>`;
    // Comic panel accents and speed lines.
    for(let i=0;i<18;i++)s+=`<path d="M${920+i*24} ${40+i*10} 1400 ${30+i*39}" stroke="${accent}" stroke-width="${i%3===0?5:2}" opacity=".16"/>`;
    if(cast){
      s+=`<path d="M695 680 1223 588l123 80-643 133Z" fill="#070b1e" opacity=".45"/>
        <g transform="translate(865 641) scale(.8) rotate(-8)" filter="url(#shade)">${figure('lumen')}</g>
        <g transform="translate(1153 647) scale(.82) rotate(8)" filter="url(#shade)">${figure(chapter===2?'io':'briar')}</g>
        <g transform="translate(999 666) scale(1.18)" filter="url(#shade)">${figure(chapter===1?'lumen':'rook')}</g>`;
    }
    s+=`<path d="M482 97h145v9H482Zm0 22h91v8h-91Z" fill="${accent}" opacity=".65"/>
      <path d="M1315 560l50 30-50 30" stroke="${accent}" stroke-width="10" fill="none" opacity=".5"/>
      <rect x="0" y="0" width="1400" height="840" fill="url(#dots)" opacity=".28"/>`;
    return wrap(s,'0 0 1400 840','preserveAspectRatio="xMidYMid slice"');
  }
  const uri=svg=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  const portraits={},sprites={},enemies={},scenes={};
  function load(source){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=source;});}
  async function prepare(){
    const tasks=[];
    for(const c of AG.Content.characters){portraits[c.id]=uri(portrait(c.id));tasks.push(load(uri(sprite(c.id))).then(im=>sprites[c.id]=im));}
    for(const type of [...Object.keys(enemyShapes),'boss'])for(let i=0;i<(type==='boss'?3:1);i++)tasks.push(load(uri(enemy(type,i))).then(im=>enemies[type+(type==='boss'?i:'')]=im));
    for(let i=0;i<3;i++)scenes[i]=uri(scene(i,true));
    await Promise.all(tasks);
  }
  return {icon,figure,portrait,sprite,enemy,scene,uri,prepare,portraits,sprites,enemies,scenes};
})();

<script>
window.AG=window.AG||{};
AG.Audio=(()=>{
  let ctx=null,enabled=AG.Store.data.settings.sound,last=0,beat=0;
  function init(){try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume().catch(()=>{});return true;}catch(_){return false;}}
  function tone(f,d=.12,type='sine',v=.02,end=f){
    if(!enabled||!init())return;
    const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.03);o.onended=()=>{o.disconnect();g.disconnect();};
  }
  function sfx(name){
    if(name==='shot'){const now=performance.now();if(now-last<110)return;last=now;tone(470,.06,'triangle',.009,240);}
    if(name==='hit')tone(100,.16,'triangle',.04,45);
    if(name==='dash')tone(260,.18,'sine',.035,65);
    if(name==='xp')tone(1100+Math.random()*200,.045,'sine',.007);
    if(name==='upgrade'){tone(392,.3,'sine',.026);tone(587,.4,'sine',.019);tone(784,.5,'sine',.016);}
    if(name==='skill'){tone(196,.5,'sine',.04,590);tone(392,.6,'triangle',.012);}
    if(name==='node'){tone(293,.6,'sine',.04);tone(440,.7,'sine',.024);}
    if(name==='boss')tone(65,.8,'triangle',.04,120);
    if(name==='click')tone(700,.065,'sine',.012,560);
  }
  function ambience(dt){
    if(!enabled)return;beat-=dt;if(beat>0)return;beat=1.65;
    const notes=[146.83,196,220,293.66,329.63,392];
    tone(notes[Math.floor(Math.random()*notes.length)],1.5,'sine',.009);
  }
  return{get enabled(){return enabled;},init,tone,sfx,ambience,toggle(){enabled=!enabled;if(enabled&&!init())enabled=false;AG.Store.data.settings.sound=enabled;AG.Store.save();if(enabled)sfx('upgrade');return enabled;}};
})();

<script>
/* Deterministic-layout, fixed-step Canvas simulation. DOM/UI lives in app.js. */
window.AG=window.AG||{};
AG.Engine=class OfficeEngine {
  constructor(canvas,onEvent=()=>{}){
    this.canvas=canvas;this.ctx=canvas.getContext('2d',{alpha:false});
    if(!this.ctx)throw new Error('This browser does not provide Canvas 2D.');
    this.onEvent=onEvent;this.world={w:2160,h:1560};this.state='idle';this.width=1;this.height=1;
    this.dpr=1;this.input={x:0,y:0};this.time=0;this.ambient=0;this.manual=false;
    this.camera={x:1080,y:780};this.motion=AG.Store.data.settings.motion;this.floor=null;
    this.last=0;this.running=true;this.raf=0;
    this.resizeObserver=new ResizeObserver(()=>this.resize());this.resizeObserver.observe(canvas);
    this.frame=this.frame.bind(this);this.raf=requestAnimationFrame(this.frame);
  }
  clamp(n,a,b){return Math.max(a,Math.min(b,n));}
  distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  random(a,b){return a+Math.random()*(b-a);}
  emit(type,payload={}){this.onEvent(type,payload);}
  resize(){
    const r=this.canvas.getBoundingClientRect();if(r.width<1||r.height<1)return;
    this.width=r.width;this.height=r.height;this.dpr=Math.min(devicePixelRatio||1,2);
    this.canvas.width=Math.round(this.width*this.dpr);this.canvas.height=Math.round(this.height*this.dpr);
  }
  start(character,chapter){
    this.character=character;this.chapter=chapter;this.chapterIndex=AG.Content.chapters.indexOf(chapter);
    this.time=0;this.kills=0;this.nodesRestored=0;this.wave=0;this.nextId=0;this.storyDone=false;this.choice=null;this.ended=false;
    this.enemies=[];this.bullets=[];this.enemyShots=[];this.gems=[];this.particles=[];this.rings=[];this.floaters=[];this.hazards=[];this.slashes=[];this.beams=[];
    this.levels=Object.fromEntries(AG.Content.modules.map(m=>[m.id,0]));this.evolved={dawn:false,hive:false,eden:false};
    this.bonus={power:0,speed:0,xp:0,armor:0,dash:0};this.grid=new Map();this.choices=[];this.rerolls=1;
    const hp=character.hp+AG.Store.data.research.vitality*10;
    this.player={x:1080,y:780,r:16,hp,maxHp:hp,xp:0,nextXp:5,level:1,invuln:1.6,dashCd:0,dashTime:0,dx:1,dy:0,skillCd:0,buff:0,freeze:0,aim:0,moving:false,stride:0,shots:0};
    this.nodes=[
      {x:1230,y:800,id:'A',charge:0,cooldown:0},
      {x:750,y:530,id:'B',charge:0,cooldown:0},
      {x:1350,y:1110,id:'C',charge:0,cooldown:0}
    ];
    this.puddles=chapter.id==='rain'?[{x:980,y:640,r:120},{x:1280,y:990,r:110},{x:640,y:1010,r:115},{x:1570,y:510,r:115}]:[];
    this.camera={x:1080,y:780};this.spawnClock=.85;this.fireClock=.15;this.droneClock=.65;this.pulseClock=3;this.thornClock=.7;
    this.boss=null;this.bossDefeated=false;this.bossSpawned=false;this.shake=0;
    this.input={x:0,y:0};this.floor=this.makeFloor();this.resize();this.state='playing';
    for(let i=0;i<5;i++){const e=this.spawn(i===4?'runner':'spore');const a=i*Math.PI*2/5;e.x=1080+Math.cos(a)*this.random(270,400);e.y=780+Math.sin(a)*this.random(260,380);}
    this.emit('start');this.emit('toast',{text:'업무 포인트를 모으세요. 커피 머신에서 체력과 경험치를 회복하세요.'});
  }
  power(){return (1+this.levels.power*.18+this.bonus.power+AG.Store.data.research.focus*.05)*(this.player.buff>0&&this.character.id==='rook'?1.3:1);}
  setInput(x,y){const l=Math.hypot(x,y);this.input={x:l>1?x/l:x,y:l>1?y/l:y};}
  pause(){if(this.state==='playing'){this.state='paused';this.setInput(0,0);this.emit('pause');}}
  resume(){if(['paused','story'].includes(this.state)){this.state='playing';this.setInput(0,0);}}
  dash(){
    if(this.state!=='playing'||this.player.dashCd>0)return false;
    const p=this.player,len=Math.hypot(this.input.x,this.input.y);
    if(len>.08){p.dx=this.input.x/len;p.dy=this.input.y/len;}
    p.dashTime=.19;p.dashCd=Math.max(1.3,3-this.levels.speed*.3-this.bonus.dash);p.invuln=Math.max(p.invuln,.38);
    this.burst(p.x,p.y,this.character.color,14,150);AG.Audio.sfx('dash');return true;
  }
  skill(){
    if(this.state!=='playing'||this.player.skillCd>0)return false;
    const p=this.player;p.skillCd=this.character.cooldown;
    if(this.character.id==='rook'){p.buff=6;this.ring(p.x,p.y,130,this.character.color,.5);}
    if(this.character.id==='lumen'){this.area(p,300,100+this.levels.weapon*15,200);this.ring(p.x,p.y,300,'#ff77a6',.8);this.enemyShots=[];}
    if(this.character.id==='briar'){this.heal(18);p.invuln=4;this.area(p,210,75,240);this.ring(p.x,p.y,220,'#79e5e3',.7);}
    if(this.character.id==='io'){p.freeze=5;for(const e of this.enemies)if(!e.dead&&this.distance(p,e)<650)this.hit(e,45*this.power(),0);this.ring(p.x,p.y,650,'#9da6ff',1);}
    this.burst(p.x,p.y,this.character.color,28,180);this.emit('toast',{text:this.character.skill+' · '+this.character.skillDesc});AG.Audio.sfx('skill');return true;
  }
  heal(n){if(this.player)this.player.hp=Math.min(this.player.maxHp,this.player.hp+n);}
  damage(n,origin){
    if(this.player.invuln>0||this.state!=='playing')return;
    const amount=Math.max(1,n-this.character.armor-this.bonus.armor),p=this.player;
    p.hp=Math.max(0,p.hp-amount);p.invuln=.75;this.shake=this.motion?5:0;
    this.burst(p.x,p.y,'#ff778e',13,135);this.float(p.x,p.y-40,'−'+Math.round(amount),'#ffbbae');AG.Audio.sfx('hit');
    if(origin){const a=Math.atan2(p.y-origin.y,p.x-origin.x);p.x=this.clamp(p.x+Math.cos(a)*12,25,2135);p.y=this.clamp(p.y+Math.sin(a)*12,25,1535);}
    if(p.hp<=0)this.finish(false);
  }
  spawn(type){
    const p=this.player,t=this.time,a=Math.random()*Math.PI*2,rad=this.clamp(Math.max(this.width,this.height)*.52,350,650);
    let x=this.clamp(p.x+Math.cos(a)*rad,35,2125),y=this.clamp(p.y+Math.sin(a)*rad,35,1525);
    if(Math.hypot(x-p.x,y-p.y)<230){x=this.clamp(p.x-Math.cos(a)*rad,35,2125);y=this.clamp(p.y-Math.sin(a)*rad,35,1525);}
    if(!type){
      const r=Math.random();
      type=t>75&&r<.13?'brute':t>40&&r<.27?'shooter':t>25&&r<.40?'beetle':t>15&&r<.62?'runner':'spore';
    }
    const stats={
      spore:{hp:26+t*.11,r:17,speed:47,damage:10,xp:1},
      runner:{hp:23+t*.1,r:13,speed:95,damage:9,xp:1},
      brute:{hp:120+t*.24,r:27,speed:34,damage:17,xp:4},
      shooter:{hp:51+t*.14,r:18,speed:35,damage:10,xp:2},
      beetle:{hp:62+t*.12,r:20,speed:62,damage:13,xp:2},
      boss:{hp:1350*this.chapter.difficulty,r:51,speed:32,damage:22,xp:24}
    }[type]||{hp:26,r:17,speed:47,damage:10,xp:1};
    const e={...stats,id:++this.nextId,type,x,y,hp:stats.hp*(type==='boss'?1:this.chapter.difficulty),maxHp:stats.hp*(type==='boss'?1:this.chapter.difficulty),phase:Math.random()*6.28,hit:0,dead:false,kx:0,ky:0,cd:type==='shooter'?this.random(1,3):2.5,orbCd:0,slow:0,charge:0,chargeAngle:0,windup:0};
    this.enemies.push(e);return e;
  }
  hit(e,damage,force=35,origin=this.player,allowCrit=true){
    if(e.dead)return;
    const crit=allowCrit&&Math.random()<this.levels.crit*.12;
    if(crit)damage*=1.8;
    e.hp-=damage;e.hit=.11;
    const a=Math.atan2(e.y-origin.y,e.x-origin.x);e.kx+=Math.cos(a)*force;e.ky+=Math.sin(a)*force;
    if(crit||e.type==='boss'||Math.random()<.25)this.float(e.x,e.y-e.r-20,''+Math.round(damage),crit?'#ffd356':'#dfe8ff',crit);
    if(e.hp<=0){
      e.dead=true;this.kills++;
      this.burst(e.x,e.y,e.type==='runner'?'#ef71a1':'#ffd35f',e.type==='boss'?60:8,e.type==='boss'?230:80);
      this.gem(e.x,e.y,e.xp);
      if(Math.random()<.05)this.gem(e.x+11,e.y+8,0,true);
      if(e.type==='boss'){this.bossDefeated=true;this.ring(e.x,e.y,360,'#ffdf63',1.1);this.emit('toast',{text:this.chapter.boss+' 처리 완료! 퇴근 시간까지 버티세요.'});AG.Audio.sfx('upgrade');}
    }
  }
  area(origin,r,damage,force=70,slow=0){
    for(const e of this.enemies)if(!e.dead&&this.distance(origin,e)<r+e.r){this.hit(e,damage*this.power(),force,origin);e.slow=Math.max(e.slow,slow);}
  }

        round(-41,-22,75,51,4,'#2d356b','#11152f');round(-35,-16,63,37,3,'#fcadc9',null);
        round(56,-12,25,30,6,'#f6cf47','#432c4f');g.fillStyle='#f8eada';g.fillRect(66,-4,6,12);
      }else{
        // Midnight server room: ominous cooling racks.
        round(-105,-65,202,125,9,'#151d3b','#0c142c',9);
        for(let i=0;i<4;i++){
          round(-93,-53+i*26,175,21,2,'#3a4c70','#11172b',3);
          for(let j=0;j<3;j++){g.fillStyle=j===0?'#ff708d':'#76ebdf';g.fillRect(-79+j*11,-45+i*26,5,5);}
          g.fillStyle='#b4ccdb';g.fillRect(-14,-46+i*26,78,4);
        }
        round(-30,83,59,32,4,'#1b315a','#11172d');
      }
      g.restore();this.decor.push({x,y});
    }
    // Directional floor arrows and caution tape.
    for(let i=0;i<12;i++){
      const x=166+i*172,y=i%2?950:590;
      g.save();g.translate(x,y);g.fillStyle=accent+'35';g.beginPath();g.moveTo(-23,-10);g.lineTo(2,-10);g.lineTo(2,-22);g.lineTo(29,0);g.lineTo(2,22);g.lineTo(2,10);g.lineTo(-23,10);g.closePath();g.fill();g.restore();
    }
    for(const q of this.puddles){
      g.fillStyle='#ff77aa20';g.strokeStyle='#ff87ba75';g.lineWidth=6;g.beginPath();g.arc(q.x,q.y,q.r,0,6.283);g.fill();g.stroke();
      g.font='bold 12px monospace';g.fillStyle='#ffadd2';g.textAlign='center';g.fillText('MEETING ZONE',q.x,q.y);
    }
    // Colored strip-lights and readable center floor label.
    g.strokeStyle=accent+'17';g.lineWidth=17;
    for(let i=0;i<5;i++){g.beginPath();g.moveTo(i*540-200,0);g.lineTo(i*540+310,1560);g.stroke();}
    g.fillStyle=accent+'80';g.textAlign='center';g.font='900 28px Arial,sans-serif';g.fillText('CLOCK OUT! / FLOOR '+ch.no,1080,560);
    g.font='bold 12px monospace';g.fillStyle='#ffffff4d';g.fillText('NO OVERTIME  •  EMERGENCY EXIT',1080,592);
    return c;
  }
  circle(x,y,r,fill,stroke,lw=1){
    const g=this.ctx;g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke();}
  }
  line(x,y,tx,ty,color,width=1){const g=this.ctx;g.beginPath();g.moveTo(x,y);g.lineTo(tx,ty);g.strokeStyle=color;g.lineWidth=width;g.stroke();}
  glow(x,y,r,color){
    const g=this.ctx,gradient=g.createRadialGradient(x,y,0,x,y,r);gradient.addColorStop(0,color);gradient.addColorStop(1,color.slice(0,7)+'00');this.circle(x,y,r,gradient);
  }
  visible(x,y,r=100){return Math.abs(x-this.camera.x)<this.width/2+r&&Math.abs(y-this.camera.y)<this.height/2+r;}
  drawNode(n){
    const g=this.ctx,ready=n.cooldown<=0,col=ready?'#ffdb54':'#7d7e94',pulse=this.motion?Math.sin(this.ambient*2+n.x)*3:0;
    if(ready)this.glow(n.x,n.y,100,'#ffd55226');
    this.circle(n.x,n.y,63+pulse,ready?'#ffd45512':null,col+'70',2);
    g.save();g.translate(n.x,n.y);g.rotate(-Math.PI/2);
    if(n.charge>0){g.beginPath();g.arc(0,0,64,0,Math.PI*2*n.charge/2);g.strokeStyle='#fff0a6';g.lineWidth=5;g.stroke();}
    g.restore();
    // Coffee vending machine (interactive restorative point).
    g.save();g.translate(n.x,n.y-10);
    g.fillStyle=ready?'#ffcb46':'#7c7c8c';g.strokeStyle='#13182d';g.lineWidth=5;
    g.beginPath();g.roundRect(-25,-29,50,61,5);g.fill();g.stroke();
    g.fillStyle='#222643';g.fillRect(-17,-21,34,24);
    g.fillStyle='#fdf0c7';g.fillRect(-10,-16,20,11);
    g.fillStyle='#fe7a9d';g.fillRect(-17,9,34,4);
    g.fillStyle='#252541';g.fillRect(-11,14,22,9);g.fillStyle='#fff5ca';g.fillRect(-7,16,14,7);
    g.fillStyle='#191d36';g.fillRect(-14,29,28,5);g.restore();
    g.font='bold 10px monospace';g.textAlign='center';g.fillStyle=ready?'#fff0b0':'#a0a2b5';g.fillText(ready?'COFFEE '+n.id:Math.ceil(n.cooldown)+'s',n.x,n.y+53);
  }
  drawEnemy(e){
    if(!this.visible(e.x,e.y,150))return;
    const g=this.ctx,isBoss=e.type==='boss';
    const image=AG.Art.enemies[e.type+(isBoss?this.chapterIndex:'')];
    const size=isBoss?195:e.type==='brute'?88:e.type==='runner'?65:e.type==='shooter'?82:76;
    g.save();g.translate(e.x,e.y);g.fillStyle='#071f1740';g.beginPath();g.ellipse(0,5,e.r*1.1,e.r*.4,0,0,Math.PI*2);g.fill();
    if(this.player.freeze>0){this.circle(0,-10,e.r+15,'#b8dbe318','#c5e6e44a',1);}
    const bob=this.motion&&this.player.freeze<=0?Math.sin(this.time*(isBoss?2:6)+e.phase)*(isBoss?2:2.5):0;
    if(image){if(e.hit>0)g.filter='brightness(1.8)';g.drawImage(image,-size/2,-size*.61+bob,size,size);g.filter='none';}
    else this.circle(0,-10,e.r,'#a1b67f');
    if(!isBoss&&e.hp<e.maxHp){g.fillStyle='#122d20';g.fillRect(-17,-size*.42,34,3);g.fillStyle='#b0c58b';g.fillRect(-17,-size*.42,34*Math.max(0,e.hp/e.maxHp),3);}
    if(e.windup>0){g.rotate(e.chargeAngle);g.fillStyle='#efbd7b26';g.fillRect(0,-21,275,42);this.line(0,-22,275,-22,'#f2c18a99',2);this.line(0,22,275,22,'#f2c18a99',2);}
    g.restore();
  }
  drawPlayer(){
    const p=this.player,g=this.ctx,im=AG.Art.sprites[this.character.id],bob=p.moving&&this.motion?Math.sin(p.stride)*1.8:0;
    g.save();g.translate(p.x,p.y);
    g.fillStyle='#071c1566';g.beginPath();g.ellipse(0,6,27,11,0,0,6.28);g.fill();
    this.circle(0,0,25,null,this.character.color+'49',1);
    if(p.invuln>.8||p.buff>0)this.glow(0,-17,60,this.character.color+'26');
    if(p.invuln>1.4&&this.character.id==='briar')this.circle(0,-16,42,'#ddcba41a','#e2d4ad80',2);
    if(p.invuln>0&&p.invuln<.7&&Math.floor(p.invuln*15)%2)g.globalAlpha=.6;
    if(im){if(p.dx<-.1)g.scale(-1,1);g.drawImage(im,-39,-88+bob,78,110);}
    g.restore();
    if(this.character.style==='orbit'){
      const count=2+this.levels.spread+(this.evolved.dawn?3:0);
      for(let i=0;i<count;i++){const a=this.time*2.4+i*Math.PI*2/count,r=this.evolved.dawn?(i%2?126:85):86,x=p.x+Math.cos(a)*r,y=p.y+Math.sin(a)*r;
        this.glow(x,y,22,'#edd19544');this.circle(x,y,5,'#f4dfaa');this.circle(x-6,y-3,3,'#e7d9a578');this.circle(x+6,y-3,3,'#e7d9a578');
      }
    }
    const count=this.levels.drone*(this.evolved.hive?2:1);
    for(let i=0;i<count;i++){const a=this.time*1.6+i*Math.PI*2/count,x=p.x+Math.cos(a)*68,y=p.y+Math.sin(a)*48-8;
      g.save();g.translate(x,y);g.fillStyle='#d5e0b978';g.beginPath();g.ellipse(-7,-4,8,4,-.4,0,6.28);g.ellipse(7,-4,8,4,.4,0,6.28);g.fill();this.circle(0,0,7,'#ddc381','#536c4c',2);this.line(-1,-5,-1,5,'#6a7851',3);g.restore();
    }
  }
  drawMinimap(){
    if(this.width<720)return;
    const g=this.ctx,x=this.width-150,y=this.height-171,w=119,h=85,sx=w/2160,sy=h/1560;
    g.fillStyle='#141831e6';g.fillRect(x,y,w,h);g.strokeStyle='#85e8ef50';g.lineWidth=1;g.strokeRect(x,y,w,h);
    g.strokeStyle='#86dbed28';g.strokeRect(x+(this.camera.x-this.width/2)*sx,y+(this.camera.y-this.height/2)*sy,Math.min(w,this.width*sx),Math.min(h,this.height*sy));
    for(const n of this.nodes)this.circle(x+n.x*sx,y+n.y*sy,2.5,n.cooldown>0?'#6f896b':'#ffd34f');
    if(this.boss&&!this.boss.dead)this.circle(x+this.boss.x*sx,y+this.boss.y*sy,3.5,'#ff77a6');
    this.circle(x+this.player.x*sx,y+this.player.y*sy,3,'#f3e8bd');
    g.fillStyle='#b4c9ef';g.textAlign='left';g.font='7px monospace';g.fillText('FLOOR '+this.chapter.no,x+5,y+11);
  }
  nodeArrow(){
    const p=this.player,n=this.nodes.filter(n=>n.cooldown<=0).sort((a,b)=>this.distance(a,p)-this.distance(b,p))[0];
    if(!n||this.visible(n.x,n.y,-55))return;
    const a=Math.atan2(n.y-this.camera.y,n.x-this.camera.x),cx=this.width/2,cy=this.height/2,r=Math.min(cx-35,cy-48);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,g=this.ctx;
    g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(10,0);g.lineTo(-5,-6);g.lineTo(-5,6);g.closePath();g.fillStyle='#ffd350';g.fill();g.restore();
    g.textAlign='center';g.font='8px monospace';g.fillStyle='#ffd350';g.fillText('COFFEE '+n.id,x,y+20);
  }
  render(){
    if(!this.player||!this.floor||this.state==='idle')return;
    const g=this.ctx;g.setTransform(this.dpr,0,0,this.dpr,0,0);g.fillStyle=this.chapter.floor;g.fillRect(0,0,this.width,this.height);
    g.save();g.translate(this.width/2-this.camera.x+(this.shake?this.random(-this.shake,this.shake):0),this.height/2-this.camera.y);
    g.drawImage(this.floor,0,0);
    for(const n of this.nodes)if(this.visible(n.x,n.y))this.drawNode(n);
    for(const h of this.hazards){
      this.circle(h.x,h.y,h.r,h.warning>0?'#e9b17516':'#d7866348',h.warning>0?'#e6b484ae':'#e4a279',2);
      const progress=1-Math.max(0,h.warning)/1.05;this.circle(h.x,h.y,h.r*progress,null,'#edd1a176',1);
      for(let i=0;i<6;i++){const a=i*Math.PI/3;this.line(h.x+Math.cos(a)*(h.r-8),h.y+Math.sin(a)*(h.r-8),h.x+Math.cos(a)*(h.r+3),h.y+Math.sin(a)*(h.r+3),'#f0c99988',2);}
      if(h.warning<=0){for(let i=0;i<4;i++){const x=h.x+Math.sin(i*4)*h.r*.6,y=h.y+Math.cos(i*4)*h.r*.55;g.beginPath();g.moveTo(x-6,y+5);g.lineTo(x,y-20);g.lineTo(x+8,y+4);g.fillStyle='#c58b66';g.fill();}}
    }
    for(const gem of this.gems)if(this.visible(gem.x,gem.y,20)){
      const y=gem.y+(this.motion?Math.sin(this.time*3+gem.phase)*2:0);
      if(gem.health){this.circle(gem.x,y,7,'#a0efff','#224e68',2);this.line(gem.x-3,y,gem.x+3,y,'#f0ecd0',2);this.line(gem.x,y-3,gem.x,y+3,'#f0ecd0',2);}
      else{g.save();g.translate(gem.x,y);g.rotate(Math.PI/4);g.fillStyle=gem.value>2?'#ff9bb7':'#ffd25a';g.fillRect(-3.5,-3.5,7,7);g.strokeStyle='#fff7c666';g.lineWidth=1;g.strokeRect(-3.5,-3.5,7,7);g.restore();}
    }
    const drawables=this.enemies.map(e=>({y:e.y,e}));drawables.push({y:this.player.y,player:true});drawables.sort((a,b)=>a.y-b.y);
    for(const item of drawables)if(item.player)this.drawPlayer();else this.drawEnemy(item.e);
    for(const s of this.slashes){g.globalAlpha=Math.max(0,s.life/s.max);g.beginPath();g.arc(s.x,s.y,s.r,s.full?0:s.angle-1.2,s.full?Math.PI*2:s.angle+1.2);g.strokeStyle=this.evolved.dawn?'#ffd350':'#ff77a6';g.lineWidth=9;g.stroke();g.beginPath();g.arc(s.x,s.y,s.r-15,s.angle-1.1,s.angle+1.1);g.strokeStyle='#75dfe666';g.lineWidth=3;g.stroke();}g.globalAlpha=1;
    for(const beam of this.beams){g.globalAlpha=beam.life/beam.max;const mx=(beam.x+beam.tx)/2+Math.sin(beam.x)*12,my=(beam.y+beam.ty)/2+Math.cos(beam.ty)*12;this.line(beam.x,beam.y,mx,my,'#73e7f366',8);this.line(mx,my,beam.tx,beam.ty,'#73e7f366',8);this.line(beam.x,beam.y,mx,my,'#92f7e5',2);this.line(mx,my,beam.tx,beam.ty,'#92f7e5',2);}g.globalAlpha=1;
    for(const b of this.bullets)if(this.visible(b.x,b.y,20)){const c=b.drone?'#ff87b7':this.character.color;this.line(b.x-b.vx*.025,b.y-b.vy*.025,b.x,b.y,c+'66',b.r*1.5);this.circle(b.x,b.y,b.r,c);this.circle(b.x-1,b.y-1,1.5,'#faf5d7');}
    for(const b of this.enemyShots){this.circle(b.x,b.y,8,'#ff6c9f32');this.circle(b.x,b.y,5,'#ff779a','#ffd4dc',1.5);}
    for(const r of this.rings){g.globalAlpha=r.life/r.max;const radius=r.r*(1-(r.life/r.max)**2);this.circle(r.x,r.y,radius,null,r.color,2.5);this.circle(r.x,r.y,Math.max(1,radius-9),null,r.color+'55',5);}g.globalAlpha=1;
    for(const p of this.particles){g.globalAlpha=p.life/p.max;g.save();g.translate(p.x,p.y);g.rotate(p.angle+p.life);g.fillStyle=p.color;g.beginPath();g.ellipse(0,0,p.size,p.size*.45,0,0,6.28);g.fill();g.restore();}g.globalAlpha=1;
    for(const f of this.floaters){g.globalAlpha=Math.min(1,f.life*2);g.textAlign='center';g.font=(f.big?'bold 16px':'11px')+' monospace';g.fillStyle='#10132bb5';g.fillText(f.text,f.x+1,f.y+1);g.fillStyle=f.color;g.fillText(f.text,f.x,f.y);}g.globalAlpha=1;
    // Subtle electrical pixels are visual only.
    if(this.motion){
      for(let i=0;i<36;i++){const x=(i*137+this.ambient*6)%2160,y=(i*283+Math.sin(this.ambient*.5+i)*20)%1560;if(this.visible(x,y,10))this.circle(x,y,1+i%2*.5,'#78e8e544');}
      if(this.chapterIndex===1){for(let i=0;i<65;i++){const x=(i*179+this.ambient*10)%2160,y=(i*293+this.ambient*90)%1560;if(this.visible(x,y,20))this.line(x,y,x-3,y+14,'#f099cb20',1);}}
    }
    g.restore();this.nodeArrow();this.drawMinimap();
  }
  frame(now){
    if(!this.running)return;
    const dt=Math.min(.05,this.last?(now-this.last)/1000:0);this.last=now;
    if(this.state!=='idle'){
      if(this.state==='playing'&&!this.manual){this.ambient+=dt;let left=dt;while(left>.000001&&this.state==='playing'){const step=Math.min(left,1/60);this.update(step);left-=step;}}
      this.render();
    }
    this.raf=requestAnimationFrame(this.frame);
  }
  snapshot(){
    return {state:this.state,time:this.time,kills:this.kills,nodesRestored:this.nodesRestored,player:this.player?{...this.player}:null,character:this.character?.id,chapter:this.chapter?.id,levels:{...this.levels},evolved:{...this.evolved},bonus:{...this.bonus},choices:this.choices?.map(x=>x.id),enemies:this.enemies?.map(e=>({...e})),bullets:this.bullets?.length,enemyShots:this.enemyShots?.length,nodes:this.nodes?.map(n=>({...n})),bossSpawned:this.bossSpawned,bossDefeated:this.bossDefeated,choice:this.choice?.id,rerolls:this.rerolls};
  }
  step(seconds){for(let t=0;t<seconds&&this.state==='playing';t+=1/60)this.update(Math.min(1/60,seconds-t));this.render();}
  destroy(){this.running=false;cancelAnimationFrame(this.raf);this.resizeObserver.disconnect();}
};

</script>
<script>
/* Accessible DOM screens, input routing, and persistence integration. */
(() => {
  'use strict';
  const $=id=>document.getElementById(id),C=AG.Content,S=AG.Store,A=AG.Art;
  const icon=A.icon,escape=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  const fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  let route='home',overlayKind=null,helpReturn=null,selectedArchive='origin',introPage=0,tutorialPage=0,toastTimer,battleTimer,cutTimer,inputGuard=0;
  let game=null,ready=false;
  const keys=new Set();let stick={active:false,id:null,x:0,y:0,ox:0,oy:0};
  const char=()=>C.characters.find(c=>c.id===S.data.selected)||C.characters[0];
  const chapter=()=>C.chapters[S.data.chapter]||C.chapters[0];
  const weaponIcon={seed:'stamp',orbit:'badge',slash:'shield',chain:'bolt'};
  const palette={green:'#ffcf40',amber:'#ff77a6',blue:'#79e5e3',pink:'#9da6ff',yellow:'#ffcf40',cyan:'#79e5e3'};
  function toast(text){
    $('site-toast').textContent=text;$('site-toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('site-toast').classList.remove('visible'),3500);
  }
  function battleToast(text){
    $('battle-toast').textContent=text;$('battle-toast').classList.add('visible');clearTimeout(battleTimer);battleTimer=setTimeout(()=>$('battle-toast').classList.remove('visible'),4200);
  }
  function tools(){
    $('wallet').innerHTML=icon('badge')+S.data.seeds;
    $('sound-btn').innerHTML=icon(AG.Audio.enabled?'sound':'mute');
    $('sound-btn').setAttribute('aria-pressed',String(AG.Audio.enabled));
    $('sound-btn').setAttribute('aria-label',AG.Audio.enabled?'소리 끄기':'소리 켜기');
    document.body.classList.toggle('low-motion',!S.data.settings.motion);
  }
  const touchMode=()=>matchMedia('(pointer: coarse)').matches;
  function resetPad(){
    const pad=$('touch-stick');
    pad.classList.remove('active');pad.style.removeProperty('left');pad.style.removeProperty('top');
    $('touch-knob').style.transform='translate(0,0)';pad.hidden=!touchMode();
  }
  function clearInput(){
    keys.clear();stick={active:false,id:null,x:0,y:0,ox:0,oy:0};resetPad();game?.setInput(0,0);
  }
  function controls(){
    let x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
    let y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0);
    if(stick.active){x=stick.x;y=stick.y;}game?.setInput(x,y);
  }
  function setOverlay(html,kind){
    clearInput();overlayKind=kind;$('overlay').hidden=false;$('overlay').className='overlay'+(kind==='intro'?' dialogue':'');
    $('overlay').innerHTML=html;$('overlay').setAttribute('role','dialog');$('overlay').setAttribute('aria-modal','true');$('overlay').setAttribute('aria-labelledby','dialog-title');
    inputGuard=performance.now()+200;requestAnimationFrame(()=>$('overlay').querySelector('button:not(:disabled)')?.focus({preventScroll:true}));
  }
  function hideOverlay(){
    overlayKind=null;$('overlay').hidden=true;$('overlay').innerHTML='';clearInput();
    if(game?.state==='playing')$('game').focus({preventScroll:true});
  }
  function heading(kicker,title,description,counter=''){
    return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1></div>${description?`<p>${description}</p>`:''}${counter?`<span class="page-counter">${counter}</span>`:''}</div>`;
  }
  function go(next,scroll=true){
    if(next==='help'){openHelp();return;}
    if(game&&['playing','paused','upgrade','story','help'].includes(game.state)&&!$('play-view').hidden){
      if(game.state==='playing')game.pause();
      else if(game.state==='paused')showPause();
      else toast('지금 열린 선택을 마친 뒤 작전을 일시정지할 수 있어요.');
      return;
    }
    hideOverlay();clearInput();if(game)game.state='idle';route=next;
    document.body.classList.remove('in-game');$('menu').hidden=false;$('play-view').hidden=true;$('footer').hidden=false;
    document.querySelectorAll('.nav-link').forEach(b=>{b.classList.toggle('active',b.dataset.nav===next);b.setAttribute('aria-current',b.dataset.nav===next?'page':'false');});
    const renders={home:renderHome,roster:renderRoster,map:renderMap,archive:renderArchive,workshop:renderWorkshop};
    $('menu').innerHTML=(renders[next]||renderHome)();tools();if(scroll)window.scrollTo({top:0,behavior:'instant'});
  }
  function renderHome(){

      <div class="help-row"><span><kbd>W A S D</kbd><kbd>↑ ↓ ← →</kbd></span><div><strong>움직임이 곧 전략</strong><p>공격은 자동입니다. 모바일과 마우스는 게임 화면을 드래그해 이동합니다.</p></div></div>
      <div class="help-row"><span><kbd>SPACE</kbd></span><div><strong>무적 돌진</strong><p>바라보는 방향으로 빠르게 빠져나옵니다. 기본 대기시간 3초.</p></div></div>
      <div class="help-row"><span><kbd>E</kbd></span><div><strong>직장인 전용 필살기</strong><p>마감 부스터, 회의 취소, 종료 선언, 시스템 프리즈! 직군마다 다릅니다.</p></div></div>
      <div class="help-row"><span>업무 포인트 · 장비</span><div><strong>성장과 진화</strong><p>업무 포인트를 모아 레벨업 카드 중 하나를 고릅니다. 결재 도장 3 + 업무 가속 매크로 2로 무기가 각성합니다.</p></div></div>
      <div class="help-row"><span>커피 머신</span><div><strong>카페인 충전</strong><p>커피 머신 원 안에서 2초 머무르면 체력·충격파·경험치를 얻습니다. 23초 뒤 재충전됩니다.</p></div></div>
    </div><p class="help-tip"><strong>목표:</strong> 3분을 버티고, 2분 25초에 등장하는 보스를 처치하세요.<br>무한 회의실의 캘린더 구역에서는 느려집니다. 바닥 경보와 알림 탄환을 피하세요.<br><kbd>P / ESC</kbd> 일시정지 · <kbd>M</kbd> 소리 · 선택과 이야기 중에는 전투가 멈춥니다.<br>진행도는 이 브라우저에 저장됩니다. ${S.available?'다른 기기로 자동 동기화되지는 않습니다.':'현재 저장이 차단되어 세션 종료 시 사라질 수 있습니다.'}</p><button class="primary" data-action="close-help">정시퇴근 도전 ${icon('check')}</button></section>`,'help');
  }
  function closeHelp(){
    const back=helpReturn;helpReturn=null;
    if(game&&back?.state)game.state=back.state;
    if(back?.kind)setOverlay(back.html,back.kind);else hideOverlay();
  }
  function updateModules(){
    if(!game?.player)return;
    const slots=[{name:game.character.weapon,icon:weaponIcon[game.character.style],level:1+game.levels.weapon}];
    for(const m of C.modules)if(m.id!=='weapon'&&game.levels[m.id])slots.push({name:m.name,icon:m.icon,level:game.levels[m.id]});
    for(const e of C.evolutions)if(game.evolved[e.id])slots.push({name:e.name,icon:e.icon,level:'✧',evolution:true});
    $('module-rack').innerHTML=slots.map(s=>`<div class="module-slot ${s.evolution?'evolution':''}" title="${s.name} ${s.level}" aria-label="${s.name} ${s.level}">${icon(s.icon)}<small>${s.level}</small></div>`).join('');
  }
  function updateHud(){
    if(!game?.player||$('play-view').hidden)return;
    const p=game.player;
    $('hp-fill').style.width=Math.max(0,p.hp/p.maxHp*100)+'%';$('hp-text').textContent=Math.ceil(p.hp)+' / '+p.maxHp;$('lv-text').textContent='LV '+String(p.level).padStart(2,'0');
    $('clock').textContent=game.time<game.chapter.duration?fmt(Math.ceil(game.chapter.duration-game.time)):'처리 중';
    $('clock').style.fontSize=game.time<game.chapter.duration?'':'22px';
    $('objective').textContent=game.bossDefeated?'퇴근 시간까지 생존하세요':game.bossSpawned?'최종 관리자를 처치하세요':'퇴근까지 남은 시간';
    $('kill-text').textContent=String(game.kills).padStart(3,'0');$('xp-fill').style.width=Math.min(100,p.xp/p.nextXp*100)+'%';$('xp-text').textContent=Math.floor(p.xp)+' / '+p.nextXp;
    $('nodes-text').textContent='커피 보충 '+game.nodesRestored+'회';
    $('skill-cd').textContent=p.skillCd>0?p.skillCd.toFixed(1)+'s':p.buff>0?'스킬 발동 중':'준비 완료';
    $('dash-cd').textContent=p.dashCd>0?p.dashCd.toFixed(1)+'s':'준비 완료';
    $('skill-cover').style.height=p.skillCd/game.character.cooldown*100+'%';$('dash-cover').style.height=p.dashCd/Math.max(1.3,3-game.levels.speed*.3-game.bonus.dash)*100+'%';
    $('skill-btn').classList.toggle('ready',p.skillCd<=0);$('dash-btn').classList.toggle('ready',p.dashCd<=0);
    $('skill-btn').setAttribute('aria-label',game.character.skill+' '+(p.skillCd>0?'대기 중':'사용 가능'));$('dash-btn').setAttribute('aria-label','돌진 '+(p.dashCd>0?'대기 중':'사용 가능'));
    const boss=game.boss;$('boss-hud').hidden=!boss||boss.dead;
    if(boss&&!boss.dead){$('boss-name').textContent=game.chapter.boss;$('boss-percent').textContent=Math.max(0,Math.ceil(boss.hp/boss.maxHp*100))+'%';$('boss-fill').style.width=Math.max(0,boss.hp/boss.maxHp*100)+'%';}
  }
  function gameEvent(type,payload){
    if(type==='start'){
      $('hud-portrait').src=A.portraits[game.character.id];$('hud-name').textContent=game.character.code+' / '+game.character.name;
      $('chapter-label').textContent='CH. '+game.chapter.no+' / '+game.chapter.name;
      $('skill-name').textContent=game.character.skill;$('skill-icon').innerHTML=icon(weaponIcon[game.character.style]);$('dash-icon').innerHTML=icon('wind');
      $('mission-text').textContent=game.chapter.id==='rain'?'캘린더 구역을 피하고 커피 머신 안에서 2초 머무르세요.':'커피 머신의 원 안에서 2초 머무르세요.';
    }
    if(type==='upgrade')showUpgrade();
    if(type==='pause')showPause();
    if(type==='story')showStory();
    if(type==='result')showResult(payload);
    if(type==='toast')battleToast(payload.text);
    if(type==='modules')updateModules();
    if(type==='boss')showCut('BOSS INCOMING / FINAL TASK',game.chapter.boss,game.chapter.bossTitle);
  }
  function selectChar(id){
    if(!C.characters.some(c=>c.id===id))return;
    S.data.selected=id;S.save();go('roster',false);
  }
  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target||target.disabled)return;
    if(target.dataset.nav){AG.Audio.sfx('click');go(target.dataset.nav);return;}
    const action=target.dataset.action,id=target.dataset.id;
    if(!action)return;AG.Audio.sfx('click');
    switch(action){
      case 'character':S.data.selected=id;S.save();go('roster');break;
      case 'select-char':selectChar(id);break;
      case 'select-chapter':S.data.chapter=Number(id);S.save();go('map',false);break;
      case 'quick':case 'begin-intro':beginIntro();break;
      case 'next-intro':if(++introPage>=chapter().intro.length)startGame();else showIntro();break;
      case 'skip-intro':startGame();break;
      case 'cancel-intro':hideOverlay();go('map');break;
      case 'upgrade':if(game.choose(Number(id))){hideOverlay();updateHud();}break;
      case 'reroll':game.reroll();break;
      case 'story-choice':if(game.applyStory(Number(id)))showStory(true);break;
      case 'story-continue':game.resume();hideOverlay();break;
      case 'resume':game.resume();hideOverlay();break;
      case 'tutorial-next':if(tutorialPage===tutorialSteps.length-1)finishTutorial();else showTutorial(tutorialPage+1);break;
      case 'tutorial-back':showTutorial(tutorialPage-1);break;
      case 'tutorial-skip':finishTutorial();break;
      case 'tutorial-replay':helpReturn=null;showTutorial();break;
      case 'help':openHelp();break;
      case 'close-help':closeHelp();break;
      case 'abandon':game.state='playing';game.finish(false);break;
      case 'read':{const a=C.archives.find(a=>a.id===id);if(!a)break;if(!S.data.archive.includes(id))toast(unlockHint(a));else{selectedArchive=id;go('archive',false);}break;}
      case 'buy':{if(S.buy(id)){go('workshop',false);toast('강화 완료. 다음 작전부터 모든 직장인에게 적용됩니다.');}else toast('업무 포인트가 부족하거나 이미 완료한 강화입니다.');break;}
      case 'retry':startGame();break;
      case 'next-chapter':S.data.chapter=Math.min(2,S.data.chapter+1);S.save();game.state='idle';hideOverlay();beginIntro();break;
      case 'result-workshop':go('workshop');break;
      case 'result-home':{const win=game.player.hp>0&&game.bossDefeated;if(win)selectedArchive=game.chapter.note;go(win?'archive':'home');break;}
    }
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='motion-toggle'){S.data.settings.motion=e.target.checked;S.save();game.motion=e.target.checked;tools();}
  });
  $('sound-btn').addEventListener('click',()=>{AG.Audio.toggle();tools();});
  $('help-btn').addEventListener('click',()=>{if(ready)openHelp();});
  $('pause-btn').addEventListener('click',()=>game?.pause());
  for(const [id,fn] of [['skill-btn',()=>game?.skill()],['dash-btn',()=>game?.dash()]]){
    $(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});
    $(id).addEventListener('click',e=>{if(e.detail===0)fn();});
  }
  const tracked=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  document.addEventListener('keydown',e=>{
    if(!ready)return;
    if(e.code==='Tab'&&overlayKind){
      const els=[...$('overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),a[href]')];const first=els[0],last=els.at(-1);
      if(e.shiftKey&&(document.activeElement===first||!$('overlay').contains(document.activeElement))){e.preventDefault();last?.focus();}
      if(!e.shiftKey&&(document.activeElement===last||!$('overlay').contains(document.activeElement))){e.preventDefault();first?.focus();}
    }
    if(!e.repeat){
      if(e.code==='KeyM'){AG.Audio.toggle();tools();}
      if(e.code==='F1'){e.preventDefault();if(overlayKind==='help')closeHelp();else openHelp();}
      if(e.code==='Escape'||e.code==='KeyP'){
        e.preventDefault();
        if(overlayKind==='help')closeHelp();
        else if(overlayKind==='pause'){game.resume();hideOverlay();}
        else if(overlayKind==='intro'){hideOverlay();if(game)game.state='idle';go('map');}
        else if(overlayKind==='tutorial')finishTutorial();
        else if(game?.state==='playing')game.pause();
      }
      if(overlayKind==='upgrade'&&performance.now()>inputGuard&&/^Digit[123]$/.test(e.code)){if(game.choose(Number(e.code.slice(-1))-1)){hideOverlay();updateHud();}}
      if(overlayKind==='story'&&performance.now()>inputGuard&&/^Digit[12]$/.test(e.code)){if(game.applyStory(Number(e.code.slice(-1))-1))showStory(true);}
      if(game?.state==='playing'&&e.code==='Space'){e.preventDefault();game.dash();}
      if(game?.state==='playing'&&e.code==='KeyE'){e.preventDefault();game.skill();}
    }
    if(game?.state==='playing'&&tracked.includes(e.code)){e.preventDefault();keys.add(e.code);controls();}
  });
  document.addEventListener('keyup',e=>{keys.delete(e.code);controls();});
  $('game').addEventListener('pointerdown',e=>{
    if(game?.state!=='playing'||stick.active||e.button>0)return;
    const r=$('game').getBoundingClientRect();
    if(touchMode()&&e.pointerType==='touch'&&(e.clientX-r.left>r.width*.65||!e.isPrimary))return;
    e.preventDefault();
    stick={active:true,id:e.pointerId,x:0,y:0,ox:e.clientX-r.left,oy:e.clientY-r.top};
    $('game').setPointerCapture(e.pointerId);
    const pad=$('touch-stick');pad.hidden=false;pad.classList.add('active');
    pad.style.left=(stick.ox-58)+'px';pad.style.top=(stick.oy-58)+'px';$('touch-knob').style.transform='translate(0,0)';
  });
  $('game').addEventListener('pointermove',e=>{
    if(!stick.active||e.pointerId!==stick.id)return;e.preventDefault();
    const r=$('game').getBoundingClientRect(),dx=e.clientX-r.left-stick.ox,dy=e.clientY-r.top-stick.oy,len=Math.hypot(dx,dy),factor=len>42?42/len:1;
    stick.x=dx*factor/42;stick.y=dy*factor/42;$('touch-knob').style.transform=`translate(${dx*factor}px,${dy*factor}px)`;controls();
  });
  const release=e=>{if(stick.id===e.pointerId){stick.active=false;stick.id=null;stick.x=stick.y=0;resetPad();controls();}};
  for(const event of ['pointerup','pointercancel','lostpointercapture'])$('game').addEventListener(event,release);
  $('game').addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('blur',()=>{clearInput();if(game?.state==='playing')game.pause();});
  window.addEventListener('resize',()=>{if(!stick.active)resetPad();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(game?.state==='playing')game.pause();}if(game)game.last=performance.now();});
  async function init(){
    $('brand-icon').innerHTML=icon('sprout');$('help-btn').innerHTML=icon('help');tools();
    $('menu').innerHTML='<section class="page"><div class="eyebrow">CONNECTING TO OFFICE NETWORK</div><h1 style="font:32px Georgia;margin-top:24px">회사 시스템에 접속하고 있어요.</h1></section>';
    try{
      await A.prepare();game=new AG.Engine($('game'),gameEvent);ready=true;go('home');
      setInterval(updateHud,100);
      if(!S.available)toast('브라우저 저장이 차단되어 진행도가 이번 세션에서만 유지됩니다.');
      if(new URLSearchParams(location.search).has('debug')){
        window.__AG_TEST__={game,store:S,get route(){return route;},get overlay(){return overlayKind;},
          snapshot:()=>game.snapshot(),
          start:(id='rook',index=0)=>{S.data.selected=id;S.data.chapter=index;startGame(true);},
          grant:(id,n=1)=>{const m=C.modules.find(m=>m.id===id);if(!m)throw new Error('Unknown module');
            for(let i=0;i<n&&game.levels[id]<m.max;i++){game.levels[id]++;if(id==='hull'){game.player.maxHp+=20;game.heal(30);}}updateModules();},
          xp:n=>{game.gainXp(n);game.checkLevel();},
          step:n=>{game.step(n);updateHud();},
          choose:i=>{const ok=game.choose(i);if(ok)hideOverlay();updateHud();return ok;},
          story:(i=0)=>{if(game.applyStory(i)){game.resume();hideOverlay();}},
          end:win=>game.finish(win),
          updateHud,go};
      }
    }catch(err){
      console.error(err);$('menu').innerHTML=`<section class="page"><h1>출근 준비 중 문제가 생겼어요.</h1><p style="margin:20px 0">페이지를 새로 고치거나 최신 브라우저로 열어 주세요.</p><pre style="white-space:pre-wrap">${escape(err.message)}</pre></section>`;
    }
  }
  init();
})();

</script>
</body>
</html>
